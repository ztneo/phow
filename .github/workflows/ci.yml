name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Install Playwright browser
        run: bun x playwright@1.63.0 install chromium-headless-shell --with-deps

      - name: Visual verification of purple site
        run: bun run verify:visual

      - name: Production build
        run: bun run build
